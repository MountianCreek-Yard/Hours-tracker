<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipping Hours Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: header bar, then a two-column work area (log form | day summary), then history and settings full width. */
:root {
  --bg: #eef0f2;
  --surface: #ffffff;
  --ink: #1d2329;
  --muted: #5d6873;
  --line: #d5dae0;
  --accent: #e8a317;       /* safety amber */
  --accent-ink: #1d2329;
  --danger: #b3261e;
  --ok: #1f7a4d;
  --a1: #2f6fb3; --a2: #2e8b57; --a3: #c7781a; --a4: #6b7480; --a5: #8a4fb8; --a6: #1a8a8a; --a7: #b8456b; --a8: #8a7a1a;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14181c; --surface: #1d2329; --ink: #e9edf1; --muted: #9aa5b0; --line: #313a43;
    --accent: #f0b43a; --accent-ink: #14181c; --danger: #f2817a; --ok: #5fc493;
    --a1: #6aa5e6; --a2: #5fc48a; --a3: #eaa04c; --a4: #a3adb8; --a5: #b98ae0; --a6: #4fc2c2; --a7: #e283a6; --a8: #cdbb52;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14181c; --surface: #1d2329; --ink: #e9edf1; --muted: #9aa5b0; --line: #313a43;
  --accent: #f0b43a; --accent-ink: #14181c; --danger: #f2817a; --ok: #5fc493;
  --a1: #6aa5e6; --a2: #5fc48a; --a3: #eaa04c; --a4: #a3adb8; --a5: #b98ae0; --a6: #4fc2c2; --a7: #e283a6; --a8: #cdbb52;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.bar {
  background: var(--surface); border-bottom: 3px solid var(--accent);
  padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; justify-content: space-between;
}
h1 { font: 700 28px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h1 span { color: var(--muted); font-weight: 600; }
.sync { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.sync::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 0; }
.sync.live::before { background: var(--ok); }
.sync.off::before { background: var(--danger); }
.daypick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.daypick label { color: var(--muted); font-size: 13px; }

main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 20px; }
.work { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 20px; align-items: start; }
@media (max-width: 820px) { .work { grid-template-columns: 1fr; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.card h2 { font: 700 19px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h2 small { font: 500 13px var(--font-body); color: var(--muted); text-transform: none; letter-spacing: 0; }

form.log { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=date], input[type=number], input[type=text], select {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg);
}
select { appearance: auto; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hours-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.hours-quick button { padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; background: transparent; cursor: pointer; font: 500 13px var(--font-mono); }
.hours-quick button:hover { border-color: var(--accent); }

.btn { padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 16px; }
.btn.primary:hover { filter: brightness(1.05); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 6px 10px; font-size: 13px; }

.msg { font-size: 13px; min-height: 18px; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--ok); }
.banner { padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.banner.warn { border-left: 4px solid var(--accent); }

.total-line { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.big { font: 700 52px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.big-label { color: var(--muted); font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 18px; }
.tile { border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: var(--radius); padding: 10px 12px; }
.tile .name { font-size: 13px; font-weight: 600; color: var(--muted); }
.tile .val { font: 700 28px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.tile .pct { font-size: 12px; color: var(--muted); }
.stack { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--bg); margin-bottom: 18px; }
.stack div { background: var(--c); }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: none; }
td.dim { color: var(--muted); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--bg); }
tr.selected td { background: color-mix(in srgb, var(--accent) 16%, transparent); }

.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--c); border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.del { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 4px; }
.del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
td.note { white-space: normal; color: var(--muted); min-width: 140px; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

details.settings summary { cursor: pointer; font: 700 19px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 14px; }
@media (max-width: 700px) { .lists { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border: 1px solid var(--line); border-radius: 99px; font-size: 14px; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; }
@media (prefers-reduced-motion: no-preference) { .btn, .del { transition: filter .15s, border-color .15s, background .15s; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

</head>
<body>
<header class="bar">
  <div><h1>Shipping Hours <span>Tracker</span></h1><div class="sync" id="sync">Connecting to shared data…</div></div>
  <div class="daypick">
    <label for="viewDate">Showing totals for</label>
    <button class="btn small" id="prevDay" type="button" aria-label="Previous day">◀</button>
    <input type="date" id="viewDate">
    <button class="btn small" id="nextDay" type="button" aria-label="Next day">▶</button>
    <button class="btn small" id="todayBtn" type="button">Today</button>
  </div>
</header>

<main>
  <div id="status" class="banner warn" hidden></div>

  <section class="work">
    <div class="card">
      <h2>Log hours</h2>
      <form class="log" id="logForm" autocomplete="off">
        <div class="field">
          <label for="fDate">Date</label>
          <input type="date" id="fDate" required>
        </div>
        <div class="field">
          <label for="fAssoc">Associate</label>
          <select id="fAssoc" required></select>
        </div>
        <div class="field">
          <label for="fAct">Activity</label>
          <select id="fAct" required></select>
        </div>
        <div class="field">
          <label for="fHours">Hours</label>
          <input type="number" id="fHours" min="0.25" max="24" step="0.25" placeholder="e.g. 4.5" required>
          <div class="hours-quick" id="quickHours"></div>
        </div>
        <div class="field">
          <label for="fNote">Notes (optional)</label>
          <input type="text" id="fNote" maxlength="200" placeholder="e.g. Covered dock 3">
        </div>
        <button class="btn primary" id="addBtn" type="submit">Add hours</button>
        <div class="msg" id="formMsg" role="status"></div>
      </form>
    </div>

    <div class="card">
      <h2><span id="dayTitle">Today</span><small id="dayCount"></small></h2>
      <div class="total-line"><span class="big" id="dayTotal">0.00</span><span class="big-label">total hours</span></div>
      <div class="stack" id="dayStack" aria-hidden="true"></div>
      <div class="tiles" id="dayTiles"></div>
      <div class="tablewrap"><table id="matrix"></table></div>
    </div>
  </section>

  <section class="card">
    <h2>Entries for this day <small>Remove a wrong entry with ×</small></h2>
    <div class="tablewrap"><table id="entries"></table></div>
  </section>

  <section class="card">
    <h2>Daily totals <small>Last 31 days with hours · click a day to open it</small></h2>
    <div class="tablewrap"><table id="history"></table></div>
  </section>

  <section class="card">
    <details class="settings" id="settings">
      <summary>Manage dropdown lists</summary>
      <div class="lists">
        <div>
          <strong>Associates</strong>
          <div class="chips" id="assocChips"></div>
          <form class="addrow" id="addAssoc"><input type="text" id="newAssoc" placeholder="Associate name" maxlength="60" aria-label="New associate name"><button class="btn small" type="submit">Add</button></form>
        </div>
        <div>
          <strong>Activities</strong>
          <div class="chips" id="actChips"></div>
          <form class="addrow" id="addAct"><input type="text" id="newAct" placeholder="Activity name" maxlength="40" aria-label="New activity name"><button class="btn small" type="submit">Add</button></form>
        </div>
      </div>
      <div class="msg" id="listMsg" role="status"></div>
    </details>
  </section>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const COLORS = ["--a1","--a2","--a3","--a4","--a5","--a6","--a7","--a8"];
  const fmt = (n) => (Math.round(n * 100) / 100).toFixed(2);
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parseYmd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const today = () => ymd(new Date());
  const shiftDay = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const pretty = (s, long) => parseYmd(s).toLocaleDateString(undefined, long ? { weekday: "long", month: "long", day: "numeric", year: "numeric" } : { weekday: "short", month: "short", day: "numeric" });
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isDate = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);

  const state = {
    db: null, uid: null, canWrite: true,
    associates: [], activities: [], listsVersionLoaded: false,
    viewDate: today(),
    dayDoc: null,          // entries map for viewDate
    history: [],           // [{date, entries}]
  };

  function colorFor(act) {
    const i = state.activities.indexOf(act);
    return "var(" + COLORS[(i < 0 ? state.activities.length : i) % COLORS.length] + ")";
  }
  function liveEntries(map) {
    if (!map || typeof map !== "object") return [];
    return Object.entries(map)
      .filter(([, e]) => e && typeof e === "object" && !e.deleted && typeof e.hours === "number" && isFinite(e.hours))
      .map(([id, e]) => ({ id, ...e }));
  }

  function setSync(text, cls) { const el = $("sync"); el.textContent = text; el.className = "sync" + (cls ? " " + cls : ""); }
  function showStatus(text) { const s = $("status"); if (text) { s.textContent = text; s.hidden = false; } else { s.hidden = true; } }
  function setMsg(el, text, kind) { el.textContent = text || ""; el.className = "msg" + (kind ? " " + kind : ""); }

  // ---------- rendering ----------
  function fillSelect(sel, items, placeholder) {
    const cur = sel.value;
    sel.innerHTML = '<option value="">' + esc(placeholder) + "</option>" + items.map((x) => '<option value="' + esc(x) + '">' + esc(x) + "</option>").join("");
    if (items.includes(cur)) sel.value = cur;
  }
  function renderLists() {
    fillSelect($("fAssoc"), state.associates, state.associates.length ? "Choose associate…" : "Add associates below first");
    fillSelect($("fAct"), state.activities, state.activities.length ? "Choose activity…" : "Add activities below first");
    $("assocChips").innerHTML = state.associates.length ? state.associates.map((a) => chip(a, "assoc")).join("") : '<span class="empty">No associates yet. Add your team below.</span>';
    $("actChips").innerHTML = state.activities.length ? state.activities.map((a) => chip(a, "act")).join("") : '<span class="empty">No activities yet.</span>';
    if (state.listsVersionLoaded && !state.associates.length) $("settings").open = true;
  }
  function chip(name, kind) {
    return '<span class="chip">' + esc(name) + '<button class="del" type="button" data-remove="' + kind + '" data-name="' + esc(name) + '" aria-label="Remove ' + esc(name) + '">×</button></span>';
  }

  function renderDay() {
    const d = state.viewDate;
    $("dayTitle").textContent = d === today() ? "Today · " + pretty(d) : pretty(d, true);
    const list = liveEntries(state.dayDoc);
    const acts = [...state.activities];
    list.forEach((e) => { if (!acts.includes(e.activity)) acts.push(e.activity); });
    const byAct = {}; acts.forEach((a) => (byAct[a] = 0));
    let total = 0;
    list.forEach((e) => { byAct[e.activity] = (byAct[e.activity] || 0) + e.hours; total += e.hours; });
    $("dayTotal").textContent = fmt(total);
    const people = new Set(list.map((e) => e.associate));
    $("dayCount").textContent = list.length ? list.length + " entries · " + people.size + " associate" + (people.size === 1 ? "" : "s") : "No hours logged yet";

    $("dayStack").innerHTML = total ? acts.filter((a) => byAct[a]).map((a) => '<div style="--c:' + colorFor(a) + ';width:' + (byAct[a] / total * 100) + '%"></div>').join("") : "";
    $("dayTiles").innerHTML = acts.map((a) =>
      '<div class="tile" style="--c:' + colorFor(a) + '"><div class="name">' + esc(a) + '</div><div class="val">' + fmt(byAct[a] || 0) + '</div><div class="pct">' + (total ? Math.round((byAct[a] || 0) / total * 100) : 0) + '% of day</div></div>').join("");

    // associate x activity matrix
    const assocs = [...people].sort((a, b) => a.localeCompare(b));
    if (!assocs.length) { $("matrix").innerHTML = '<tr><td class="empty">Hours by associate will show here once someone logs time for this day.</td></tr>'; }
    else {
      let h = "<thead><tr><th>Associate</th>" + acts.map((a) => '<th class="num">' + esc(a) + "</th>").join("") + '<th class="num">Total</th></tr></thead><tbody>';
      assocs.forEach((p) => {
        let rt = 0;
        h += "<tr><td>" + esc(p) + "</td>" + acts.map((a) => { const v = list.filter((e) => e.associate === p && e.activity === a).reduce((s, e) => s + e.hours, 0); rt += v; return '<td class="num' + (v ? "" : " dim") + '">' + (v ? fmt(v) : "–") + "</td>"; }).join("") + '<td class="num"><strong>' + fmt(rt) + "</strong></td></tr>";
      });
      h += '<tr class="total"><td>Day total</td>' + acts.map((a) => '<td class="num">' + fmt(byAct[a] || 0) + "</td>").join("") + '<td class="num">' + fmt(total) + "</td></tr></tbody>";
      $("matrix").innerHTML = h;
    }

    // entries list
    const sorted = list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    if (!sorted.length) $("entries").innerHTML = '<tr><td class="empty">Nothing logged for ' + esc(pretty(d)) + ". Use the Log hours form to add the first entry.</td></tr>";
    else $("entries").innerHTML = "<thead><tr><th>Associate</th><th>Activity</th><th class=\"num\">Hours</th><th>Notes</th><th></th></tr></thead><tbody>" +
      sorted.map((e) => "<tr><td>" + esc(e.associate) + '</td><td><span class="pill" style="--c:' + colorFor(e.activity) + '">' + esc(e.activity) + '</span></td><td class="num">' + fmt(e.hours) + '</td><td class="note">' + esc(e.note || "") + '</td><td><button class="del" type="button" data-del="' + esc(e.id) + '" aria-label="Remove this entry"' + (state.canWrite ? "" : " disabled") + ">×</button></td></tr>").join("") + "</tbody>";
  }

  function renderHistory() {
    const rows = state.history.map((h) => ({ date: h.date, list: liveEntries(h.entries) })).filter((r) => r.list.length);
    const acts = [...state.activities];
    rows.forEach((r) => r.list.forEach((e) => { if (!acts.includes(e.activity)) acts.push(e.activity); }));
    if (!rows.length) { $("history").innerHTML = '<tr><td class="empty">Daily totals appear here as hours are logged.</td></tr>'; return; }
    const grand = {}; let gt = 0;
    let h = "<thead><tr><th>Date</th>" + acts.map((a) => '<th class="num">' + esc(a) + "</th>").join("") + '<th class="num">Total</th><th class="num">Associates</th></tr></thead><tbody>';
    rows.forEach((r) => {
      let t = 0;
      const cells = acts.map((a) => { const v = r.list.filter((e) => e.activity === a).reduce((s, e) => s + e.hours, 0); t += v; grand[a] = (grand[a] || 0) + v; return '<td class="num' + (v ? "" : " dim") + '">' + (v ? fmt(v) : "–") + "</td>"; }).join("");
      gt += t;
      h += '<tr class="clickable' + (r.date === state.viewDate ? " selected" : "") + '" data-date="' + esc(r.date) + '" tabindex="0"><td>' + esc(pretty(r.date)) + "</td>" + cells + '<td class="num"><strong>' + fmt(t) + '</strong></td><td class="num">' + new Set(r.list.map((e) => e.associate)).size + "</td></tr>";
    });
    h += '<tr class="total"><td>All shown days</td>' + acts.map((a) => '<td class="num">' + fmt(grand[a] || 0) + "</td>").join("") + '<td class="num">' + fmt(gt) + '</td><td></td></tr></tbody>';
    $("history").innerHTML = h;
  }

  // ---------- data (Supabase) ----------
  const HISTORY_DAYS = 62;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function q(promise) {
    const { data, error } = await promise;
    if (error) throw error;
    return data;
  }
  function toMap(rows) {
    const m = {};
    rows.forEach((r) => { m[r.id] = { associate: r.associate, activity: r.activity, hours: Number(r.hours), note: r.note || "", createdAt: Date.parse(r.created_at) || 0, deleted: !!r.deleted }; });
    return m;
  }
  async function loadDay() {
    if (!state.db) return;
    const date = state.viewDate;
    const rows = await q(state.db.from("hour_entries").select("*").eq("work_date", date).eq("deleted", false).order("created_at"));
    if (date !== state.viewDate) return;
    state.dayDoc = toMap(rows);
    renderDay();
  }
  async function loadHistory() {
    if (!state.db) return;
    const since = shiftDay(today(), -HISTORY_DAYS);
    const rows = await q(state.db.from("hour_entries").select("id,work_date,associate,activity,hours,deleted,created_at").gte("work_date", since).eq("deleted", false).order("work_date", { ascending: false }).limit(10000));
    const byDay = {};
    rows.forEach((r) => { (byDay[r.work_date] = byDay[r.work_date] || []).push(r); });
    state.history = Object.keys(byDay).sort().reverse().slice(0, 31).map((d) => ({ date: d, entries: toMap(byDay[d]) }));
    renderHistory();
  }
  async function loadLists() {
    if (!state.db) return;
    const [as, acts] = await Promise.all([
      q(state.db.from("associates").select("name").order("name")),
      q(state.db.from("activities").select("name,sort").order("sort").order("name")),
    ]);
    state.associates = as.map((r) => r.name);
    state.activities = acts.map((r) => r.name);
    state.listsVersionLoaded = true;
    renderLists(); renderDay(); renderHistory();
  }
  function watchDay() {
    state.dayDoc = null; renderDay();
    loadDay().catch(() => showStatus("Couldn't load this day's hours. Check your connection and reload."));
  }
  function setView(date) {
    if (!isDate(date)) return;
    state.viewDate = date;
    $("viewDate").value = date;
    $("fDate").value = date;
    watchDay();
    renderHistory();
  }
  async function addEntry(date, entry) {
    await q(state.db.from("hour_entries").insert({ work_date: date, associate: entry.associate, activity: entry.activity, hours: entry.hours, note: entry.note || null }));
    refreshSoon();
  }
  async function saveLists(next) {
    const addA = next.associates.filter((x) => !state.associates.includes(x));
    const delA = state.associates.filter((x) => !next.associates.includes(x));
    const addT = next.activities.filter((x) => !state.activities.includes(x));
    const delT = state.activities.filter((x) => !next.activities.includes(x));
    if (addA.length) await q(state.db.from("associates").insert(addA.map((name) => ({ name }))));
    if (delA.length) await q(state.db.from("associates").delete().in("name", delA));
    if (addT.length) await q(state.db.from("activities").insert(addT.map((name, i) => ({ name, sort: state.activities.length + i + 1 }))));
    if (delT.length) await q(state.db.from("activities").delete().in("name", delT));
    await loadLists();
  }
  let refreshTimer = null;
  function refreshSoon() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => { loadDay().catch(() => {}); loadHistory().catch(() => {}); }, 250);
  }

  // ---------- events ----------
  $("quickHours").innerHTML = [1, 2, 4, 6, 8, 10].map((h) => '<button type="button" data-h="' + h + '">' + h + "</button>").join("");
  $("quickHours").addEventListener("click", (ev) => { const b = ev.target.closest("[data-h]"); if (b) { $("fHours").value = b.dataset.h; $("fHours").focus(); } });

  $("logForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const msg = $("formMsg");
    if (!state.db) { setMsg(msg, "Not connected to the database. Check the Supabase settings in index.html.", "err"); return; }
    const date = $("fDate").value, associate = $("fAssoc").value, activity = $("fAct").value;
    const hours = parseFloat($("fHours").value), note = $("fNote").value.trim();
    if (!isDate(date)) return setMsg(msg, "Pick a date.", "err");
    if (!associate) return setMsg(msg, "Choose an associate.", "err");
    if (!activity) return setMsg(msg, "Choose an activity.", "err");
    if (!(hours > 0 && hours <= 24)) return setMsg(msg, "Enter hours between 0.25 and 24.", "err");
    $("addBtn").disabled = true; setMsg(msg, "Saving…");
    try {
      await addEntry(date, { associate, activity, hours: Math.round(hours * 100) / 100, note, createdAt: Date.now() });
      setMsg(msg, "Added " + fmt(hours) + " h of " + activity + " for " + associate + ".", "ok");
      $("fHours").value = ""; $("fNote").value = ""; $("fAct").value = ""; $("fAct").focus();
      if (date !== state.viewDate) setView(date);
    } catch (e) {
      if (e && e.code === "42501") setMsg(msg, "The database refused the save. Run the setup SQL from README.md, step 1.", "err");
      else if (e && e.code === "42P01") setMsg(msg, "The database tables don't exist yet. Run the setup SQL from README.md, step 1.", "err");
      else setMsg(msg, "Couldn't save. Check your connection and press Add hours again.", "err");
    } finally { $("addBtn").disabled = false; }
  });

  $("entries").addEventListener("click", async (ev) => {
    const b = ev.target.closest("[data-del]"); if (!b || !state.db) return;
    const id = b.dataset.del;
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Remove?"; b.style.fontSize = "13px"; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ""; b.textContent = "×"; b.style.fontSize = ""; } }, 3000); return; }
    b.disabled = true;
    try { await q(state.db.from("hour_entries").update({ deleted: true }).eq("id", id)); refreshSoon(); }
    catch (e) { b.disabled = false; showStatus(e && e.code === "42501" ? "The database refused the change. Run the setup SQL from README.md, step 1." : "Couldn't remove that entry. Try again."); }
  });

  $("history").addEventListener("click", (ev) => { const r = ev.target.closest("tr[data-date]"); if (r) { setView(r.dataset.date); window.scrollTo({ top: 0, behavior: "smooth" }); } });
  $("history").addEventListener("keydown", (ev) => { if (ev.key === "Enter") { const r = ev.target.closest("tr[data-date]"); if (r) setView(r.dataset.date); } });
  $("viewDate").addEventListener("change", (e) => setView(e.target.value));
  $("prevDay").addEventListener("click", () => setView(shiftDay(state.viewDate, -1)));
  $("nextDay").addEventListener("click", () => setView(shiftDay(state.viewDate, 1)));
  $("todayBtn").addEventListener("click", () => setView(today()));

  function listAdd(kind, input) {
    const name = input.value.trim().replace(/\s+/g, " ");
    const key = kind === "assoc" ? "associates" : "activities";
    if (!name) return;
    if (state[key].some((x) => x.toLowerCase() === name.toLowerCase())) { setMsg($("listMsg"), name + " is already on the list.", "err"); return; }
    if (!state.db) { setMsg($("listMsg"), "Saving isn't available right now.", "err"); return; }
    const next = { associates: [...state.associates], activities: [...state.activities] };
    next[key].push(name);
    if (key === "associates") next.associates.sort((a, b) => a.localeCompare(b));
    saveLists(next).then(() => { input.value = ""; setMsg($("listMsg"), "Added " + name + ".", "ok"); })
      .catch((e) => setMsg($("listMsg"), e && e.code === "23505" ? "That name is already on the list." : e && e.code === "42501" ? "The database refused the change. Run the setup SQL from README.md." : "Couldn't save. Try again.", "err"));
  }
  $("addAssoc").addEventListener("submit", (e) => { e.preventDefault(); listAdd("assoc", $("newAssoc")); });
  $("addAct").addEventListener("submit", (e) => { e.preventDefault(); listAdd("act", $("newAct")); });
  document.querySelector(".lists").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-remove]"); if (!b || !state.db) return;
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Remove?"; b.style.fontSize = "12px"; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ""; b.textContent = "×"; b.style.fontSize = ""; } }, 3000); return; }
    const key = b.dataset.remove === "assoc" ? "associates" : "activities";
    const next = { associates: [...state.associates], activities: [...state.activities] };
    next[key] = next[key].filter((x) => x !== b.dataset.name);
    saveLists(next).then(() => setMsg($("listMsg"), "Removed " + b.dataset.name + ". Hours already logged for it are kept.", "ok"))
      .catch((e) => setMsg($("listMsg"), e && e.code === "23503" ? "Couldn't remove it. Try again." : "Couldn't save. Try again.", "err"));
  });

  // ---------- start ----------
  $("viewDate").value = state.viewDate; $("fDate").value = state.viewDate;
  renderLists(); renderDay(); renderHistory();

  (async function connect() {
    const url = window.SUPABASE_URL || "", key = window.SUPABASE_ANON_KEY || "";
    if (!/^https:\/\//.test(url) || key.indexOf("PASTE") === 0 || !key) {
      setSync("Not connected: Supabase settings missing", "off");
      showStatus("This tracker isn't connected to your database yet. Paste your Supabase URL and anon key into index.html (see README.md, step 2).");
      $("addBtn").disabled = true; return;
    }
    if (!window.supabase || !window.supabase.createClient) {
      setSync("Not connected", "off");
      showStatus("Couldn't load the Supabase library. Check your internet connection and reload.");
      $("addBtn").disabled = true; return;
    }
    state.db = window.supabase.createClient(url, key);
    try {
      await Promise.all([loadLists(), loadHistory(), loadDay()]);
      setSync("Connected · shared live with everyone using this site", "live");
      showStatus("");
      if (!state.activities.length) showStatus("No activities found. Run the setup SQL from README.md, step 1, which adds Picking, Packing, Direct and Indirect.");
    } catch (e) {
      setSync("Not connected", "off");
      showStatus(e && e.code === "42P01" ? "The database tables don't exist yet. Run the setup SQL from README.md, step 1, then reload." : "Couldn't reach your Supabase database (" + (e && (e.message || e.code) || "error") + "). Check the URL and key in index.html, then reload.");
      return;
    }
    // Live updates when anyone adds or removes hours or changes the lists
    try {
      state.db.channel("tracker")
        .on("postgres_changes", { event: "*", schema: "public", table: "hour_entries" }, refreshSoon)
        .on("postgres_changes", { event: "*", schema: "public", table: "associates" }, () => loadLists().catch(() => {}))
        .on("postgres_changes", { event: "*", schema: "public", table: "activities" }, () => loadLists().catch(() => {}))
        .subscribe();
    } catch (e) { /* live updates are optional; the refresh below still runs */ }
    // Safety net: refresh every 30 seconds and when the tab comes back into view
    setInterval(() => { if (!document.hidden) { refreshSoon(); } }, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { refreshSoon(); loadLists().catch(() => {}); } });
  })();
})();
</script>
</body>
</html>
